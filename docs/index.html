    <script>
      // Safeguard against "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(val) { originalFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();

      // Fix GitHub Pages path resolution:
      // Ensure trailing slash on GitHub Pages so relative asset paths like ./assets/... resolve correctly
      (function() {
        try {
          var loc = window.location;
          if (loc.hostname && loc.hostname.endsWith('github.io')) {
            var path = loc.pathname;
            // If path doesn't end with slash and doesn't point to a file with extension
            if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
              loc.replace(loc.origin + path + '/' + loc.search + loc.hash);
            }
          }
        } catch (e) {}
      })();

      // Fallback for direct repository root hosting on GitHub Pages:
      // If the browser cannot load /src/main.tsx (static hosting of unbuilt repo),
      // smoothly redirect to the pre-built /docs/ folder.
      window.addEventListener('error', function(e) {
        try {
          if (e && e.filename && e.filename.indexOf('main.tsx') !== -1) {
            if (window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs')) {
              var p = window.location.pathname;
              var target = p.endsWith('/') ? p + 'docs/' : p + '/docs/';
              window.location.replace(window.location.origin + target + window.location.search + window.location.hash);
            }
          }
        } catch (err) {}
      }, true);
    </script>
