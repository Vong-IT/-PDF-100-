<!DOCTYPE html>
<html lang="km">
  <head>
    <meta charset="utf-8">
    <title>Secure PDF Manager & Khmer Converter</title>
    <script>
      (function() {
        try {
          var loc = window.location;
          // When 404 happens on GitHub Pages, redirect back to repository root cleanly
          if (loc.hostname && loc.hostname.endsWith('github.io')) {
            var parts = loc.pathname.split('/').filter(Boolean);
            var repoName = parts.length > 0 ? parts[0] : '';
            var target = loc.origin + (repoName ? '/' + repoName + '/' : '/');
            loc.replace(target);
          } else {
            loc.replace('/');
          }
        } catch (e) {
          window.location.href = './';
        }
      })();
    </script>
  </head>
  <body style="font-family: system-ui, sans-serif; text-align: center; padding-top: 60px; background: #f8fafc; color: #334155;">
    <p>កំពុងត្រឡប់ទៅកាន់ទំព័រដើម... / Redirecting to application root...</p>
  </body>
</html>
