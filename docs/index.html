<!doctype html>
<html lang="km">
  <head>
    <script>
      // Safeguard against "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(val) { originalFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();

      // Fix GitHub Pages path resolution:
      // Ensure trailing slash on GitHub Pages so relative asset paths like ./assets/... resolve correctly
      (function() {
        try {
          var loc = window.location;
          if (loc.hostname && loc.hostname.endsWith('github.io')) {
            var path = loc.pathname;
            // If path doesn't end with slash and doesn't point to a file with extension
            if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
              loc.replace(loc.origin + path + '/' + loc.search + loc.hash);
            }
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="Secure PDF Manager & Khmer Converter" />
    <meta property="og:description" content="កម្មវិធីគ្រប់គ្រង PDF បម្លែងឯកសារទៅជារូបភាព ឬអត្ថបទរហ័ស ធានាមិនខុសជើងអក្សរខ្មែរ និងរក្សាទ្រង់ទ្រាយដើម រួមទាំងប្រព័ន្ធចាក់សោការពារដោយលេខសម្ងាត់។" />

    <script>
      // Global error listener to detect any failed script loading on GitHub Pages
      window.addEventListener('error', function(event) {
        if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
          var failedUrl = event.target.src || event.target.href || '';
          console.error('[Asset Load Error]', failedUrl);
          var errBox = document.getElementById('app-loading-error');
          if (errBox) {
            errBox.style.display = 'block';
            var msg = document.getElementById('app-error-detail');
            if (msg) msg.textContent = failedUrl;
          }
        }
      }, true);
    </script>
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">

  <body class="font-khmer antialiased bg-slate-50 text-slate-800">
    <div id="root">
      <div id="app-loading-placeholder" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; padding: 24px; text-align: center;">
        <div style="width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <h2 style="font-size: 18px; font-weight: 700; color: #1e293b; margin: 0 0 6px 0;">កំពុងដំណើរការកម្មវិធី...</h2>
        <p style="font-size: 13px; color: #64748b; margin: 0 0 16px 0;">Loading Secure PDF Manager & Khmer Converter...</p>

        <!-- Hidden error message that reveals itself if loading fails -->
        <div id="app-loading-error" style="display: none; max-width: 480px; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 12px; padding: 14px 18px; text-align: left; margin-top: 10px;">
          <div style="font-weight: 700; color: #9f1239; font-size: 14px; margin-bottom: 4px;">⚠️ មិនអាចទាញយកឯកសារកូដបាន (Asset Load Error)</div>
          <div id="app-error-detail" style="font-size: 12px; color: #be123c; font-family: monospace; word-break: break-all; margin-bottom: 10px;"></div>
          <p style="font-size: 12px; color: #881337; margin: 0 0 10px 0;">សូមពិនិត្យមើល Folder ក្នុង GitHub Settings > Pages (ជ្រើសរើស <b>/docs</b>)។</p>
          <button onclick="window.location.reload(true)" style="background: #e11d48; color: white; border: none; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;">ព្យាយាមម្តងទៀត (Reload)</button>
        </div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
  </body>
</html>
